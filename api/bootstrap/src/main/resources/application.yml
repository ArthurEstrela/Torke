spring:
  application:
    name: torke-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/torke}
    username: ${DB_USERNAME:torke}
    password: ${DB_PASSWORD:torke_local}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
torke:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-me-with-at-least-32-characters}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
